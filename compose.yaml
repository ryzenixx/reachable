services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: reachable
      POSTGRES_USER: reachable
      POSTGRES_PASSWORD: reachable
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U reachable -d reachable"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: